<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-key="dashboard_title">Dashboard - VegCheck AI</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <div class="bg-canvas"></div>
    <nav class="glass-nav">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="index.html"><img src="assets/icons/logo.svg" alt="VegCheck AI" /></a>
                <div class="d-flex align-items-center gap-3">
                    <select id="languageSelect" class="form-select form-select-sm" style="width:auto;">
            <option value="en" data-key="lang_en">English</option>
            <option value="es" data-key="lang_es">Español</option>
            <option value="hi" data-key="lang_hi">हिंदी</option>
          </select>
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" data-key="theme_toggle_dark" onclick="toggleTheme()">🌙 Dark</button>
          <ul class="navbar-nav flex-row gap-1" style="margin:0;">
          <li class="nav-item"><a class="nav-link active" href="dashboard.html" data-key="nav_dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="predict.html" data-key="nav_predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html" data-key="nav_history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html" data-key="nav_profile">Profile</a></li>
          <li class="nav-item" id="adminNavItem" style="display:none;">
            <a class="nav-link" href="admin.html" data-key="nav_admin" style="background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.25);border-radius:8px;color:#fde047!important;">🛡️ Admin</a>
          </li>
                        <li class="nav-item"><a class="nav-link" href="#" onclick="logout()" data-key="nav_logout" style="color:var(--danger)!important;">Logout</a></li>
            </ul>
          </div>
        </div>
      </nav>

    <div class="container py-4" style="position:relative;z-index:1;">
      <div class="d-flex align-items-center gap-3 mb-4 animate-fadeInUp">
        <div style="font-size:2rem;">📊</div>
        <div>
          <h2 style="font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0;" data-key="dashboard_heading">Dashboard</h2>
          <p style="color:var(--muted);font-size:0.83rem;margin:0;" data-key="dashboard_sub">Your quality detection overview</p>
        </div>
      </div>
      <div class="row g-4" id="statsRow"></div>
      <div class="row g-4 mt-2">
        <div class="col-lg-8 animate-fadeInLeft delay-2">
          <div class="glass-card p-4">
            <h5 style="font-weight:700;margin-bottom:1rem;" data-key="dashboard_recent">🕒 Recent Predictions</h5>
            <div id="recentPredictions"></div>
          </div>
        </div>
        <div class="col-lg-4 animate-fadeInRight delay-2">
          <div class="glass-card p-4">
            <h5 style="font-weight:700;margin-bottom:1rem;" data-key="dashboard_quick">⚡ Quick Actions</h5>
            <div class="d-flex flex-column gap-2 mt-2">
              <a href="predict.html" class="btn-submit" style="text-align:center;text-decoration:none;display:block;" data-key="dashboard_new_pred">🔍 New Prediction</a>
              <a href="history.html" class="btn-outline-custom" style="justify-content:center;" data-key="history_new_pred">📋 View History</a>
              <a href="profile.html" class="btn-outline-custom" style="justify-content:center;" data-key="dashboard_profile">👤 My Profile</a>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-sm btn-outline-secondary" onclick="history.back()" data-key="back_btn">← Back</button>
        <a href="predict.html" class="btn btn-sm btn-outline-secondary" data-key="new_prediction_arrow">New Prediction →</a>
      </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin-nav.js"></script>
    <script>
            const API = 'http://127.0.0.1:8000';

      async function loadDashboard() {
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; return; }
        try {
          const res = await fetch('http://127.0.0.1:8000/dashboard', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          if (!res.ok) { alert(data.detail || t('dashboard_load_error')); return; }
          document.getElementById('statsRow').innerHTML = `
            <div class="col-6 col-md-3 animate-fadeInUp delay-1"><div class="stat-card"><h5>${t('stats_total')}</h5><h2>${data.total_predictions}</h2></div></div>
            <div class="col-6 col-md-3 animate-fadeInUp delay-2"><div class="stat-card"><h5 style="color:var(--p1)">${t('stats_fresh')}</h5><h2 style="background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${data.fresh_count}</h2></div></div>
            <div class="col-6 col-md-3 animate-fadeInUp delay-3"><div class="stat-card"><h5 style="color:var(--warn)">${t('stats_moderate')}</h5><h2 style="background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${data.moderately_fresh_count}</h2></div></div>
            <div class="col-6 col-md-3 animate-fadeInUp delay-4"><div class="stat-card"><h5 style="color:var(--danger)">${t('stats_rotten')}</h5><h2 style="background:linear-gradient(135deg,#f87171,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${data.rotten_count}</h2></div></div>`;
          const qColor = q => q === 'Fresh' ? 'var(--p1)' : q === 'Moderately Fresh' ? 'var(--warn)' : 'var(--danger)';
          const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
          document.getElementById('recentPredictions').innerHTML = data.recent_predictions.length
            ? data.recent_predictions.map(p => `<div class="history-item"><span><strong style="color:${qColor(p.quality)};font-weight:700;">${p.quality}</strong> <span style="color:var(--muted);font-size:0.8rem;">${fmtDate(p.prediction_date)}</span></span><span style="color:var(--muted);font-size:0.78rem;background:rgba(255,255,255,0.05);padding:0.2rem 0.6rem;border-radius:6px;">${p.confidence}%</span></div>`).join('')
            : '<p style="color:var(--muted);">' + t('dashboard_no_pred') + ' <a href="predict.html" style="color:var(--p1);">' + t('dashboard_make_first') + '</a></p>';
                } catch { alert(t('cannot_connect')); }
      }
      loadDashboard();
      function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
    </script>
  </body>
</html>

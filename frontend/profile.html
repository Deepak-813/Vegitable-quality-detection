<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-key="profile_title">Profile - VegCheck AI</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <div class="bg-canvas"></div>
    <nav class="glass-nav">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="index.html"><img src="assets/icons/logo.svg" alt="VegCheck AI" /></a>
        <div class="d-flex align-items-center gap-3">
          <select id="languageSelect" class="form-select form-select-sm" style="width:auto;">
            <option value="en" data-key="lang_en">English</option>
            <option value="es" data-key="lang_es">Español</option>
            <option value="hi" data-key="lang_hi">हिंदी</option>
          </select>
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" data-key="theme_toggle_dark" onclick="toggleTheme()">🌙 Dark</button>
          <ul class="navbar-nav flex-row gap-1" style="margin:0;">
            <li class="nav-item"><a class="nav-link" href="dashboard.html" data-key="nav_dashboard">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="predict.html" data-key="nav_predict">Predict</a></li>
            <li class="nav-item"><a class="nav-link" href="history.html" data-key="nav_history">History</a></li>
            <li class="nav-item"><a class="nav-link active" href="profile.html" data-key="nav_profile">Profile</a></li>
            <li class="nav-item" id="adminNavItem" style="display:none;">
              <a class="nav-link" href="admin.html" data-key="nav_admin" style="background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.25);border-radius:8px;color:#fde047!important;">🛡️ Admin</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="logout()" data-key="nav_logout" style="color:var(--danger)!important;">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>


    <div class="container py-4" style="position:relative;z-index:1;">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="glass-card p-4 animate-scaleIn">
            <div style="text-align:center;margin-bottom:1.5rem;">
              <div style="width:80px;height:80px;background:linear-gradient(135deg,rgba(0,245,160,0.15),rgba(0,217,247,0.1));border:1px solid rgba(0,245,160,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1rem;overflow:hidden;">
                <img id="profilePicPreview" src="assets/icons/default-avatar.svg" alt="Profile" data-key="profile_picture" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:none;" />
                <span id="profilePicPlaceholder" style="display:block;">👤</span>
              </div>
              <h3 style="font-weight:900;background:linear-gradient(135deg,#fff,var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;" data-key="profile_heading">My Profile</h3>
            </div>

            <div id="profileInfo"><div class="d-flex justify-content-center"><div class="spinner" style="border-top-color:var(--p1);border-color:rgba(0,245,160,0.2);width:20px;height:20px;"></div></div></div>

            <div id="editProfileForm" style="display:none;margin-top:1.5rem;" class="animate-fadeInUp">
              <h5 style="font-weight:700;margin-bottom:1rem;color:var(--p1);" data-key="edit_profile">Edit Profile</h5>
              <div class="mb-3">
                <label class="form-label" style="color:var(--muted);" data-key="full_name">Full Name</label>
                <input type="text" class="form-control" id="editFullName" placeholder="John Doe" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);" />
              </div>
              <div class="mb-3">
                <label class="form-label" style="color:var(--muted);" data-key="phone_number">Phone Number</label>
                <input type="tel" class="form-control" id="editPhone" placeholder="+1 234 567 8900" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);" />
              </div>
              <div class="mb-3">
                <label class="form-label" style="color:var(--muted);" data-key="profile_picture">Profile Picture</label>
                <input type="file" class="form-control" id="profilePicInput" accept="image/*" />
              </div>
              <div id="picPreview" style="margin-top:0.75rem;text-align:center;display:none;">
                <img id="picPreviewImg" src="" alt="Preview" style="max-width:80px;max-height:80px;border-radius:50%;object-fit:cover;" />
              </div>
              <div class="d-flex gap-2 mt-4">
                <button class="btn btn-sm btn-outline-secondary" onclick="cancelEdit()" data-key="cancel">Cancel</button>
                <button class="btn btn-primary-custom" id="saveProfileBtn" onclick="saveProfile()" data-key="save_changes">Save Changes</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-sm btn-outline-secondary" onclick="history.back()" data-key="back_btn">← Back</button>
        <a href="dashboard.html" class="btn btn-sm btn-outline-secondary" data-key="dashboard_link">Dashboard →</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin-nav.js"></script>
    <script>
      const API = 'http://127.0.0.1:8000';
      let userData = null;
      async function loadProfile() {
        const token = localStorage.getItem('token');
        if (!token) return window.location.href = 'login.html';
        try {
          const res = await fetch(API + '/profile', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          userData = data;
          if (data.profile_picture) {
            document.getElementById('profilePicPreview').src = API + '/uploads/' + data.profile_picture;
            document.getElementById('profilePicPreview').style.display = 'block';
            document.getElementById('profilePicPlaceholder').style.display = 'none';
          }
          document.getElementById('profileInfo').innerHTML =
            '<div style="background:rgba(0,245,160,0.05);border:1px solid rgba(0,245,160,0.12);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem;">' +
              '<p style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.2rem;">' + t('username') + '</p>' +
              '<p style="font-weight:700;font-size:1rem;">' + data.username + '</p></div>' +
            '<div style="background:rgba(0,245,160,0.05);border:1px solid rgba(0,245,160,0.12);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem;">' +
                            '<p style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.2rem;">' + t('email') + '</p>' +
              '<p style="font-weight:700;font-size:1rem;">' + data.email + '</p></div>' +
            (data.full_name ? '<div style="background:rgba(0,245,160,0.05);border:1px solid rgba(0,245,160,0.12);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem;"><p style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.2rem;">' + t('full_name') + '</p><p style="font-weight:700;font-size:1rem;">' + data.full_name + '</p></div>' : '') +
            (data.phone ? '<div style="background:rgba(0,245,160,0.05);border:1px solid rgba(0,245,160,0.12);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1.5rem;"><p style="color:var(--muted);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:0.2rem;">' + t('phone') + '</p><p style="font-weight:700;font-size:1rem;">' + data.phone + '</p></div>' : '') +
            '<div class="d-flex justify-content-center">' +
              '<button class="btn btn-submit w-100" style="max-width:200px;" onclick="showEditProfile()">' + t('edit_profile') + '</button>' +
            '</div>';
        } catch { document.getElementById('profileInfo').innerHTML = '<p style="color:#fca5a5;">' + t('profile_cannot_connect') + '</p>'; }
      }
      function showEditProfile() {
        document.getElementById('profileInfo').style.display = 'none';
        document.getElementById('editProfileForm').style.display = 'block';
        document.getElementById('editFullName').value = userData?.full_name || '';
        document.getElementById('editPhone').value = userData?.phone || '';
      }
      function cancelEdit() {
        document.getElementById('editProfileForm').style.display = 'none';
        document.getElementById('profileInfo').style.display = 'block';
      }
      async function saveProfile() {
        const token = localStorage.getItem('token');
        if (!token) return window.location.href = 'login.html';
        const fullName = document.getElementById('editFullName').value.trim();
        const phone = document.getElementById('editPhone').value.trim();
        const file = document.getElementById('profilePicInput').files[0];

        if (phone && phone !== (userData?.phone || '') && !/^[\\d\\s\\+\\-\\(\\)]{7,20}$/.test(phone)) {
          alert(t('invalid_phone'));
          return;
        }

        const fd = new FormData();
        if (fullName !== (userData?.full_name || '')) fd.append('full_name', fullName);
        if (phone !== (userData?.phone || '')) fd.append('phone', phone);
        if (file) fd.append('file', file);

        if (fd.keys().next().done) {
          document.getElementById('editProfileForm').style.display = 'none';
          document.getElementById('profileInfo').style.display = 'block';
          return;
        }

        try {
          const res = await fetch(API + '/profile/update', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: fd });
          const data = await res.json();
          if (data.profile_picture) {
            document.getElementById('profilePicPreview').src = API + '/uploads/' + data.profile_picture;
            document.getElementById('profilePicPreview').style.display = 'block';
            document.getElementById('profilePicPlaceholder').style.display = 'none';
          }
          document.getElementById('profilePicInput').value = '';
          document.getElementById('picPreview').style.display = 'none';
          document.getElementById('editProfileForm').style.display = 'none';
          document.getElementById('profileInfo').style.display = 'block';
          loadProfile();
          showAlert(t('profile_updated'), 'success');
        } catch { showAlert(t('failed_save_profile'), 'error'); }
      }
      document.getElementById('profilePicInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          document.getElementById('picPreviewImg').src = url;
          document.getElementById('picPreview').style.display = 'block';
        }
      });
      function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
      loadProfile();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-key="history_title">History - VegCheck AI</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  </head>
  <body>
    <div class="bg-canvas"></div>
      <nav class="glass-nav">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="index.html"><img src="assets/icons/logo.svg" alt="VegCheck AI" /></a>
        <div class="d-flex align-items-center gap-3">
          <select id="languageSelect" class="form-select form-select-sm" style="width:auto;">
            <option value="en" data-key="lang_en">English</option>
            <option value="es" data-key="lang_es">Español</option>
            <option value="hi" data-key="lang_hi">हिंदी</option>
          </select>
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" data-key="theme_toggle_dark" onclick="toggleTheme()">🌙 Dark</button>
          <ul class="navbar-nav flex-row gap-1" style="margin:0;">
          <li class="nav-item"><a class="nav-link" href="dashboard.html" data-key="nav_dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="predict.html" data-key="nav_predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link active" href="history.html" data-key="nav_history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html" data-key="nav_profile">Profile</a></li>
          <li class="nav-item" id="adminNavItem" style="display:none;">
            <a class="nav-link" href="admin.html" data-key="nav_admin" style="background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.25);border-radius:8px;color:#fde047!important;">🛡️ Admin</a>
          </li>
                            <li class="nav-item"><a class="nav-link" href="#" onclick="logout()" style="color:var(--danger)!important;"><span data-key="nav_logout">Logout</span></a></li>
            </ul>
          </div>
        </div>
      </nav>

    <div class="container py-4" style="position:relative;z-index:1;">
      <div class="d-flex align-items-center gap-3 mb-4 animate-fadeInUp">
        <div style="font-size:2rem;">📋</div>
        <div>
          <h2 style="font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:0;" data-key="history_heading">Prediction History</h2>
          <p style="color:var(--muted);font-size:0.83rem;margin:0;" data-key="history_sub">All your past analyses</p>
        </div>
      </div>
      <div id="historyList" class="glass-card p-4 animate-fadeInUp delay-1"></div>
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-sm btn-outline-secondary" onclick="history.back()" data-key="back_btn">&#8592; Back</button>
        <a href="predict.html" class="btn btn-sm btn-outline-secondary" data-key="history_new_pred">New Prediction &#8594;</a>
      </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="assets/js/theme.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin-nav.js"></script>
        <script>
      // Language — handled by translations.js (no inline setup needed)
            async function loadHistory() {
        const token = localStorage.getItem('token');
        if (!token) return window.location.href = 'login.html';
        try {
          const res = await fetch('http://127.0.0.1:8000/history', { headers: { Authorization: `Bearer ${token}` } });
          const data = await res.json();
          const container = document.getElementById('historyList');
          if (!data.length) {
            container.innerHTML = '<p style="color:rgba(255,255,255,0.4);">' + t('history_no_pred') + ' <a href="predict.html">' + t('history_make_first') + '</a></p>';
            return;
          }
                    const qColor = q => q === 'Fresh' ? 'var(--p1)' : q === 'Moderately Fresh' ? 'var(--warn)' : 'var(--danger)';
          const fmtDate = (iso) => { if (!iso) return ''; const d = new Date(iso); return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
          container.innerHTML = data.map(item => `
            <div class="history-item">
              <div>
                <strong style="color:${qColor(item.quality)};font-weight:700;font-size:0.95rem;">${item.quality}</strong>
                <span style="color:var(--muted);font-size:0.8rem;"> &bull; ${fmtDate(item.prediction_date)}</span>
                <div style="color:var(--muted);font-size:0.82rem;margin-top:0.2rem;">
                  ${item.storage_days} days &bull; ${item.storage_temperature}
                </div>
              </div>
              <div class="d-flex gap-2">
                <button class="btn-primary-custom" style="font-size:0.78rem;padding:0.4rem 0.9rem;" onclick="downloadPdfReport(${item.id}, this)">${t('history_pdf')}</button>
                <button class="btn-outline-custom" style="font-size:0.78rem;padding:0.4rem 0.9rem;border-color:rgba(248,113,113,0.3);color:var(--danger);" onclick="deleteItem(${item.id}, this)">${t('history_delete')}</button>
              </div>
            </div>`).join('');
        } catch { document.getElementById('historyList').innerHTML = '<p style="color:#fca5a5;">' + t('cannot_connect') + '</p>'; }
      }

      async function deleteItem(id, btn) {
        const token = localStorage.getItem('token');
        btn.disabled = true;
        const res = await fetch(`http://127.0.0.1:8000/history/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
        if (res.ok) loadHistory();
        else btn.disabled = false;
      }

      loadHistory();
      function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
    </script>
  </body>
</html>

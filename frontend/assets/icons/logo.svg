<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 44" width="180" height="44">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pot -->
  <path d="M13 32 L11 40 L27 40 L25 32 Z" fill="url(#leafGrad)" opacity="0.7" rx="2"/>
  <rect x="10" y="30" width="18" height="4" rx="2" fill="url(#leafGrad)" opacity="0.85"/>

  <!-- Stem -->
  <path d="M19 30 C19 24, 19 18, 19 14" stroke="url(#leafGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Left big leaf -->
  <path d="M19 20 C14 16, 7 16, 6 10 C6 10, 14 8, 19 16" fill="url(#leafGrad)" opacity="0.95" filter="url(#glow)"/>
  <!-- Left leaf vein -->
  <path d="M19 20 C14 16, 9 13, 6 10" stroke="#060b14" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Right big leaf -->
  <path d="M19 16 C24 12, 31 12, 32 6 C32 6, 24 4, 19 12" fill="url(#leafGrad)" opacity="0.95" filter="url(#glow)"/>
  <!-- Right leaf vein -->
  <path d="M19 16 C24 12, 28 9, 32 6" stroke="#060b14" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- Small top leaf -->
  <path d="M19 14 C17 10, 15 7, 17 4 C17 4, 22 6, 20 12" fill="url(#leafGrad)" opacity="0.8"/>

  <!-- VegCheck text -->
  <text x="42" y="29" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="20" fill="url(#textGrad)" letter-spacing="-0.5">VegCheck</text>
</svg>

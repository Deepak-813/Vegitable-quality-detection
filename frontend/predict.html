<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-key="predict_title">Predict - VegCheck AI</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/animations.css" />
  <style>
    .big-btn { font-size: 1.05rem !important; padding: 0.7rem 1.3rem !important; min-width: 230px; border-radius: 12px; }
    .big-dl { font-size: 0.95rem !important; padding: 0.55rem 1.1rem !important; }
    .thumb-box { cursor: pointer; }
  </style>
  </head>
  <body>
    <div class="bg-canvas"></div>
    <nav class="glass-nav">
      <div class="container d-flex align-items-center justify-content-between">
        <a class="navbar-brand" href="index.html"><img src="assets/icons/logo.svg" alt="VegCheck AI" /></a>
                  <div class="d-flex align-items-center gap-3">
          <select id="languageSelect" class="form-select form-select-sm" style="width:auto;">
                      <option value="en" data-key="lang_en">English</option>
            <option value="es" data-key="lang_es">Español</option>
            <option value="hi" data-key="lang_hi">हिंदी</option>
          </select>
          <button id="themeToggle" class="btn btn-sm btn-outline-secondary" data-key="theme_toggle_dark" onclick="toggleTheme()">🌙 Dark</button>
          <ul class="navbar-nav flex-row gap-1" style="margin:0;">
          <li class="nav-item"><a class="nav-link active" href="dashboard.html" data-key="nav_dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="predict.html" data-key="nav_predict">Predict</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html" data-key="nav_history">History</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html" data-key="nav_profile">Profile</a></li>
          <li class="nav-item" id="adminNavItem" style="display:none;">
            <a class="nav-link" href="admin.html" style="background:rgba(234,179,8,0.12);border:1px solid rgba(234,179,8,0.25);border-radius:8px;color:#fde047!important;"><span data-key="nav_admin">🛡️ Admin</span></a>
          </li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()" style="color:var(--danger)!important;"><span data-key="nav_logout">Logout</span></a></li>
        </ul>
      </div>
      </nav>

    <div class="container py-4" style="position:relative;z-index:1;">
      <div class="row g-4">
        <div class="col-lg-6 animate-fadeInLeft">
          <div class="glass-card p-4">
            <h4 style="font-weight:800;margin-bottom:1.2rem;background:linear-gradient(135deg,#fff,var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;" data-key="predict_upload">📤 Upload Image</h4>
            <label for="imageInput" style="display:block;cursor:pointer;">
              <div class="upload-zone" id="uploadZone">
                <span class="upload-icon">🥦</span>
                <span style="font-weight:600;" data-key="predict_click_drag">Click to choose or drag & drop</span>
                <span style="font-size:0.78rem;" data-key="predict_supported">JPG, PNG, WEBP supported</span>
              </div>
            </label>
            <input type="file" id="imageInput" style="display:none;" accept="image/*" multiple />
            <div id="previewBox" style="display:none;margin-top:1rem;text-align:center;"></div>
            <button id="predictBtn" class="btn-submit mt-3" data-key="predict_analyse">🔍 Analyse Quality</button><button id="batchBtn" type="button" class="btn mt-3 ms-2" style="font-size:1.12rem;padding:0.7rem 1.3rem;font-weight:600;border:1px solid rgba(251,191,36,0.45);background:rgba(251,191,36,0.1);color:#fbbf24;" data-key="predict_batch">📦 Batch Analyse</button>
          </div>
        </div>
        <div class="col-lg-6 animate-fadeInRight">
          <div class="glass-card p-4" id="resultCard" style="min-height:300px;">
            <h4 style="font-weight:800;margin-bottom:0.5rem;" data-key="predict_result">Prediction Result</h4>
            <p style="color:var(--muted);font-size:0.88rem;" data-key="predict_no_result">Your analysis will appear here after uploading an image.</p>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-between mt-4">
        <button class="btn btn-sm btn-outline-secondary" onclick="history.back()" data-key="back_btn">&#8592; Back</button>
        <a href="dashboard.html" class="btn btn-sm btn-outline-secondary" data-key="dashboard_link">Dashboard &#8594;</a>
      </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/translations.js"></script>
    <script src="assets/js/chatbot.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin-nav.js"></script>
    <script src="assets/js/predict.js"></script>
    <script>
      }
</script>
  </body>
</html>
